<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timkademy - Salon des Métiers (23 Mai)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a; /* Fond sombre élégant qui fait ressortir l'affiche */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            font-family: sans-serif;
        }
        .container {
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
            max-height: 95vh; /* Empêche l'affiche de dépasser de l'écran en hauteur */
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="AFFICHE_23_MAI.png" alt="Affiche Officielle Timkademy - Salon des Métiers">
    </div>

</body>
</html>
